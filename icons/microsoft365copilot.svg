<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Microsoft-style gradient background -->
  <defs>
    <linearGradient id="copilotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCF2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#copilotGradient)"/>

  <!-- Chat bubble icon -->
  <g fill="white">
    <!-- Main chat bubble -->
    <path d="M 18 20 C 18 17.79 19.79 16 22 16 L 42 16 C 44.21 16 46 17.79 46 20 L 46 36 C 46 38.21 44.21 40 42 40 L 28 40 L 20 46 L 20 40 C 18.9 40 18 39.1 18 38 Z"/>

    <!-- Sparkle/AI indicator (top right) -->
    <circle cx="44" cy="18" r="3"/>
    <path d="M 44 14 L 44 22 M 40 18 L 48 18"/>

    <!-- Text lines inside bubble -->
    <rect x="24" y="23" width="16" height="2" rx="1" opacity="0.9"/>
    <rect x="24" y="28" width="12" height="2" rx="1" opacity="0.9"/>
    <rect x="24" y="33" width="14" height="2" rx="1" opacity="0.9"/>
  </g>
</svg>
